---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-e2e-test-suite
spec:
  params:
    - name: e2e-image
      description: Pre-built e2e test runner image (python3, pulp-cli, rpm-rs, oras)
      type: string
    - name: e2e-run-id
      description: Unique suffix for build-scoped Pulp resources (PipelineRun UID from the pipeline)
      type: string
    - name: ociStorage
      description: |
        OCI registry URL where the pipeline stores trusted artifacts, including
        both resulting artifacts and intermediary by-products.
      default: quay.io/redhat-user-workloads/artifact-storage-tenant/tooling/pulp-e2e-testing
  workspaces:
    - name: test
    - name: repository
  stepTemplate:
    image: $(params.e2e-image)
    imagePullPolicy: Always
    env:
      - name: PULP_CLI_CONFIG
        value: /etc/pulp-access/cli.toml
      - name: TEST_WORKSPACE
        value: $(workspaces.test.path)
      - name: PULP_TOOL_PATH
        value: $(workspaces.repository.path)/source
      - name: E2E_RUN_ID
        value: $(params.e2e-run-id)
  steps:
    - name: pre-test-setup
      script: |
        #!/usr/bin/env sh
        set -eu

        "${PULP_TOOL_PATH}/e2e/pre-test.py" --build-dir "${TEST_WORKSPACE}"

    - name: pulp-tool-test
      env:
        - name: PULP_RESULTS
          value: /etc/pulp-results/pulp-results.json
      script: |
        #!/usr/bin/env sh
        set -eu
        pip3 install -e "${PULP_TOOL_PATH}"

        "${PULP_TOOL_PATH}/e2e/test-pulp-tool.py" --real-server \
          --config "${PULP_CLI_CONFIG}" \
          --rpm-dir "${TEST_WORKSPACE}/test_pkgs" \
          --pulp-results "${PULP_RESULTS}" \
          --run-id "${E2E_RUN_ID}" \
          --oci-storage "$(params.ociStorage)"

      volumeMounts:
        - name: cli-toml-volume
          mountPath: /etc/pulp-access
          readOnly: true
        - name: pulp-results-volume
          mountPath: /etc/pulp-results
          readOnly: true
    - name: post-test-validation
      script: |
        #!/usr/bin/env sh
        set -eu

        "${PULP_TOOL_PATH}/e2e/post-test-validation.py" \
          --config "${PULP_CLI_CONFIG}" \
          --run-id "${E2E_RUN_ID}" \
          --oci-storage "$(params.ociStorage)"

      volumeMounts:
        - name: cli-toml-volume
          mountPath: /etc/pulp-access
          readOnly: true
  volumes:
    - name: cli-toml-volume
      secret:
        secretName: pulp-access
        items:
          - key: cli.toml
            path: cli.toml
    - name: pulp-results-volume
      secret:
        secretName: pulp-results
        items:
          - key: pulp-results.json
            path: pulp-results.json
