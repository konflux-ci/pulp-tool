---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: post-test-cleanup
spec:
  params:
    - name: cleanup-image
      description: >-
        Stable base image for post-test cleanup. Installs python3 and pulp-cli
        at runtime so cleanup can run even when build-e2e-image fails.
      type: string
      default: registry.access.redhat.com/ubi10/ubi-minimal:10.2
    - name: e2e-run-id
      description: Unique suffix for build-scoped Pulp resources (PipelineRun UID from the pipeline)
      type: string
    - name: ociStorage
      description: OCI registry used for ORAS e2e (must match run-e2e-test-suite for cleanup scope)
      type: string
      default: quay.io/redhat-user-workloads/artifact-storage-tenant/tooling/pulp-e2e-testing
  workspaces:
    - name: repository
  stepTemplate:
    image: $(params.cleanup-image)
    env:
      - name: PULP_CLI_CONFIG
        value: /etc/pulp-access/cli.toml
      - name: PULP_TOOL_PATH
        value: $(workspaces.repository.path)/source
      - name: E2E_RUN_ID
        value: $(params.e2e-run-id)
  steps:
    - name: post-test-cleanup
      script: |
        #!/usr/bin/env sh
        set -eu

        microdnf install -y python3 python3-pip
        microdnf clean all
        pip3 install --no-cache-dir --root-user-action=ignore pulp-cli

        python3 "${PULP_TOOL_PATH}/e2e/post-test-cleanup.py" \
          --config "${PULP_CLI_CONFIG}" \
          --run-id "${E2E_RUN_ID}" \
          --oci-storage "$(params.ociStorage)"

      volumeMounts:
        - name: cli-toml-volume
          mountPath: /etc/pulp-access
          readOnly: true
  volumes:
    - name: cli-toml-volume
      secret:
        secretName: pulp-access
        items:
          - key: cli.toml
            path: cli.toml
