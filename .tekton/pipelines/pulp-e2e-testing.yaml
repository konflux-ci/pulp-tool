apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pulp-e2e-testing
  labels:
    appstudio.openshift.io/application: tooling
    appstudio.openshift.io/component: pulp-e2e-testing
    pipelines.appstudio.openshift.io/type: build
spec:
  params:
    - name: git-url
      description: URL of the Git repository to clone
      type: string
    - name: revision
      description: Git revision to checkout
      type: string
    - name: output-image
      description: Fully qualified image name for the e2e runner output
      type: string
    - name: cleanup-output-image
      description: Fully qualified image name for the post-test-cleanup image (Dockerfile.e2e-cleanup)
      type: string
    - name: image-expires-after
      description: Image expiration time
      type: string
      default: 5d
    - name: dockerfile
      description: Path to the e2e runner Dockerfile inside the cloned source tree (under source/)
      type: string
      default: e2e/Dockerfile.e2e
    - name: cleanup-dockerfile
      description: Path to the e2e cleanup Dockerfile inside the cloned source tree (under source/)
      type: string
      default: e2e/Dockerfile.e2e-cleanup
    - name: path-context
      description: Build context relative to the cloned source tree (Konflux buildah SOURCE_CODE_DIR)
      type: string
      default: .
    - name: enable-cache-proxy
      description: Enable Konflux cache proxy (passed to init; feeds buildah HTTP_PROXY/NO_PROXY)
      type: string
      default: "false"
    - name: ociStorage
      description: |
        OCI registry for ORAS e2e tests (same default as Konflux trusted-artifact storage for this component).
      type: string
      default: quay.io/redhat-user-workloads/artifact-storage-tenant/tooling/pulp-e2e-testing
  workspaces:
    - name: test
      description: Workspace for test artifacts
    - name: repository
      description: Workspace for cloned repository
    - name: git-auth
      description: Git authentication credentials
      optional: true
  tasks:
    - name: init
      params:
        - name: enable-cache-proxy
          value: $(params.enable-cache-proxy)
      taskRef:
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:aa7ede4ed5470bc128f62701f3d7ba1fce87ba996eed9f59dd65eb62b8de437e
          - name: kind
            value: task
        resolver: bundles
    - name: clone-repository
      runAfter:
        - init
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      taskRef:
        params:
          - name: name
            value: git-clone
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.6@sha256:e47cc258b382ca4cd46b525b84ac0aad971e00c70bb8f9e3d35ccfd3082c7486
          - name: kind
            value: task
        resolver: bundles
      workspaces:
        - name: output
          workspace: repository
        - name: basic-auth
          workspace: git-auth
    - name: build-e2e-image
      runAfter:
        - clone-repository
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: SOURCE_URL
          value: $(params.git-url)
        - name: SKIP_SBOM_GENERATION
          value: "true"
        - name: HTTP_PROXY
          value: $(tasks.init.results.http-proxy)
        - name: NO_PROXY
          value: $(tasks.init.results.no-proxy)
      taskRef:
        params:
          - name: name
            value: buildah
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.14.1@sha256:db9124c6b8de548bd8d4a6a14e9629203d524acfbfc6e4635fb654cf63632cc0
          - name: kind
            value: task
        resolver: bundles
      workspaces:
        - name: source
          workspace: repository
    - name: build-e2e-cleanup-image
      runAfter:
        - clone-repository
      params:
        - name: IMAGE
          value: $(params.cleanup-output-image)
        - name: DOCKERFILE
          value: $(params.cleanup-dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: SOURCE_URL
          value: $(params.git-url)
        - name: SKIP_SBOM_GENERATION
          value: "true"
        - name: HTTP_PROXY
          value: $(tasks.init.results.http-proxy)
        - name: NO_PROXY
          value: $(tasks.init.results.no-proxy)
      taskRef:
        params:
          - name: name
            value: buildah
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.14.1@sha256:db9124c6b8de548bd8d4a6a14e9629203d524acfbfc6e4635fb654cf63632cc0
          - name: kind
            value: task
        resolver: bundles
      workspaces:
        - name: source
          workspace: repository
    - name: run-e2e-test-suite
      runAfter:
        - build-e2e-image
      params:
        - name: e2e-image
          value: $(tasks.build-e2e-image.results.IMAGE_REF)
        - name: e2e-run-id
          value: $(context.pipelineRun.uid)
        - name: ociStorage
          value: $(params.ociStorage)
      taskRef:
        resolver: git
        params:
          - name: revision
            value: $(params.revision)
          - name: url
            value: $(params.git-url)
          - name: pathInRepo
            value: .tekton/tasks/run-e2e-test-suite.yaml
      workspaces:
        - name: test
          workspace: test
        - name: repository
          workspace: repository
  finally:
    - name: post-test-cleanup
      params:
        - name: cleanup-image
          value: $(tasks.build-e2e-cleanup-image.results.IMAGE_REF)
        - name: e2e-run-id
          value: $(context.pipelineRun.uid)
        - name: ociStorage
          value: $(params.ociStorage)
      taskRef:
        resolver: git
        params:
          - name: revision
            value: $(params.revision)
          - name: url
            value: $(params.git-url)
          - name: pathInRepo
            value: .tekton/tasks/post-test-cleanup.yaml
      workspaces:
        - name: repository
          workspace: repository
