# Pre-commit hooks configuration for pulp-tool
# Mirrors GitHub Actions: python-diff-lint.yml, security-scan.yml (pip-audit)
#
# Commit stage: lint + pip-audit (pip-audit only when uv.lock/pyproject.toml change).
# Push stage: test-diff-coverage + checkton (PR-only jobs in CI).
#
# Install hooks:
#   pre-commit install
#   pre-commit install --hook-type pre-push
#
# Run everything locally (commit + pre-push stages):
#   pre-commit run --all-files
#   pre-commit run --hook-stage pre-push --all-files

repos:
  # General hygiene (local-only; not duplicated in CI)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # python-lint job (.github/workflows/python-diff-lint.yml)
  - repo: local
    hooks:
      - id: lock-check
        name: lock-check (uv.lock)
        entry: make lock-check
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: ruff check pulp_tool tests
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check pulp_tool tests
        language: system
        pass_filenames: false
        always_run: true

      - id: pylint
        name: pylint (errors only)
        entry: scripts/run-pylint-precommit.sh
        language: script
        files: ^(pulp_tool|tests)/.*\.py$

      - id: mypy
        name: mypy
        entry: mypy pulp_tool tests --show-error-codes
        language: system
        pass_filenames: false
        always_run: true

  # security-scan job (pip-audit)
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (dev deps)
        entry: scripts/run-pip-audit-precommit.sh
        language: script
        files: ^(uv\.lock|pyproject\.toml)$
        pass_filenames: false

  # repo-lint job (yamllint --strict .)
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint -c config/yamllint.yml --strict .
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --skip=uv.lock,htmlcov,.git
          - --ignore-words=config/codespell-ignore-words.txt
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: hadolint
        name: hadolint
        entry: scripts/run-hadolint.sh
        language: script
        files: ^(container/Dockerfile|e2e/Dockerfile\.e2e(-cleanup)?)$

  # tekton-lint + test-diff-coverage jobs (PR CI; run on pre-push)
  - repo: local
    hooks:
      - id: checkton
        name: checkton (Tekton embedded scripts)
        entry: scripts/run-checkton.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: test-diff-coverage
        name: test-diff-coverage (100%)
        entry: make test-diff-coverage
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Conventional Commits (optional: pre-commit install --hook-type commit-msg)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose, --strict]
