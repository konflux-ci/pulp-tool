name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'

      # pip-audit: fail on new OSV/PyPI advisories. Pygments CVE-2026-4539 (dev-only via pytest/diff-cover):
      # no release >2.19.2 on PyPI yet — remove these --ignore-vuln flags when pyproject pins pygments>=2.19.3.
      # Dev deps install from uv.lock (no editable install) so setuptools-scm does not rewrite pulp_tool/_version.py.
      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip uv pip-audit
          uv export --frozen --extra dev --no-emit-project -o /tmp/requirements-audit.txt
          pip install -r /tmp/requirements-audit.txt
          pip-audit -l --desc on \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln GHSA-5239-wwwm-4pmq

      # Bandit 1.9+ removed built-in SARIF; bandit-sarif-formatter registers --format sarif.
      - name: Run Bandit (HIGH severity gate)
        run: |
          pip install 'bandit[toml]>=1.8.0' 'bandit-sarif-formatter>=1.1.1'
          bandit -r pulp_tool -c pyproject.toml -f sarif -o bandit.sarif -lll
          bandit -r pulp_tool -c pyproject.toml -lll

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: bandit.sarif
          category: bandit
