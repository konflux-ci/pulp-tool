name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      # pip-audit: fail on new OSV/PyPI advisories. Dev deps from uv.lock (no editable install).
      - name: Run pip-audit
        run: |
          python -m pip install --upgrade 'pip>=26.2' 'uv>=0.13.4' 'pip-audit>=2.10.0'
          uv export --frozen --extra dev --no-emit-project -o /tmp/requirements-audit.txt
          pip install -r /tmp/requirements-audit.txt
          pip-audit -l --desc on

      # Bandit 1.9+ removed built-in SARIF; bandit-sarif-formatter registers --format sarif.
      - name: Run Bandit (HIGH severity gate)
        run: |
          pip install 'bandit[toml]>=1.8.0' 'bandit-sarif-formatter>=1.1.1'
          bandit -r pulp_tool -c pyproject.toml -f sarif -o bandit.sarif -lll
          bandit -r pulp_tool -c pyproject.toml -lll

      # Code Scanning upload can fail transiently ("Uploading results" with no API error in logs).
      # The HIGH-severity gate above is authoritative; SARIF is for the Security tab only.
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit
          wait-for-processing: false
