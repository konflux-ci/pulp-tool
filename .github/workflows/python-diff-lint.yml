---
name: Lint

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python (ruff, pylint, mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify uv.lock matches pyproject.toml
        run: |
          pip install uv
          make lock-check

      - name: Ruff lint
        run: ruff check pulp_tool tests

      - name: Ruff format
        run: ruff format --check pulp_tool tests

      - name: Pylint (errors only)
        run: pylint --rcfile=config/pylintrc pulp_tool tests --errors-only -j 0

      - name: Mypy
        run: mypy pulp_tool tests --show-error-codes

  test-diff-coverage:
    name: Tests and diff coverage (100%)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests and diff coverage
        run: make test-diff-coverage COMPARE_BRANCH=origin/${{ github.base_ref }}

  repo-lint:
    name: YAML, shell, spelling, Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install lint tools
        env:
          HADOLINT_VERSION: v2.14.0
        run: |
          python -m pip install --upgrade pip
          pip install yamllint codespell
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mkdir -p "$HOME/.local/bin"
          HADOLINT_ASSET=hadolint-Linux-x86_64
          HADOLINT_BIN="$HOME/.local/bin/hadolint"
          curl -sSfL \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/${HADOLINT_ASSET}" \
            -o "${HADOLINT_BIN}"
          expected=$(curl -sSfL \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/${HADOLINT_ASSET}.sha256" \
            | awk '{print $1}')
          actual=$(sha256sum "${HADOLINT_BIN}" | awk '{print $1}')
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::hadolint checksum mismatch (expected ${expected}, got ${actual})"
            exit 1
          fi
          chmod +x "${HADOLINT_BIN}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Yamllint
        run: yamllint -c config/yamllint.yml --strict .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Codespell
        run: codespell --skip=uv.lock,htmlcov,.git --ignore-words=config/codespell-ignore-words.txt

      - name: Hadolint
        run: |
          hadolint --ignore DL3041 --ignore DL3013 container/Dockerfile
          hadolint --ignore DL3041 --ignore DL3013 e2e/Dockerfile.e2e
          hadolint --ignore DL3041 --ignore DL3013 e2e/Dockerfile.e2e-cleanup

  tekton-lint:
    name: Tekton embedded scripts (Checkton)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkton
        uses: chmeliik/checkton@c24110a11ba3d4acb90964be57fc1177fed2918f # v0.4.0
        with:
          fail-on-findings: true
